<!doctype html>
<html lang="en" class="sl-theme-dark">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="robots" content="noindex,nofollow" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="referrer" content="no-referrer" />
        <meta name="theme-color" content="#1C1B22" />
        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
        <title>Moombox - Login</title>

        <!-- Shoelace UI Components — SRI-pinned; hashes match those in index.html.
             Both themes loaded so the preference-aware bootstrap below can pick. -->
        <link
            rel="stylesheet"
            id="sl-theme-dark"
            href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.16.0/cdn/themes/dark.css"
            integrity="sha384-GWYIqFA394qpD/MvZTDi2pLPBjEux2y3wDvsvEa/s+DXOt1YxPYCRsisFUKlaJf/"
            crossorigin="anonymous"
        />
        <link
            rel="stylesheet"
            id="sl-theme-light"
            href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.16.0/cdn/themes/light.css"
            crossorigin="anonymous"
            media="not all"
        />
        <!-- Theme bootstrap — a file, not an inline script, so script-src can
             be 'self' with no 'unsafe-inline'. Parser-blocking and placed
             after the two theme <link> tags so it runs before first paint and
             can swap which stylesheet is active. -->
        <script src="/boot-theme.js"></script>
        <script
            type="module"
            src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.16.0/cdn/shoelace-autoloader.js"
            integrity="sha384-t9SlygVzod2/NhAjzDBVhkqxTeKE4e4iLm3A92sOlUqH45sU5iLLtITVxFum3Fyi"
            crossorigin="anonymous"
        ></script>

        <style>
            * { box-sizing: border-box; margin: 0; padding: 0; }
            body {
                font-family: var(--sl-font-sans);
                /* Follow the active Shoelace theme tokens instead of hardcoding dark #1C1B22. */
                background: var(--sl-color-neutral-0);
                color: var(--sl-color-neutral-900);
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                /* dvh tracks the visible viewport as mobile browser chrome collapses/expands. */
                min-height: 100dvh;
                padding: 1rem;
            }
            .login-container {
                background: var(--sl-color-neutral-50);
                border-radius: var(--sl-border-radius-large);
                padding: 2rem;
                width: 100%;
                max-width: 380px;
                min-width: 0;
                box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
            }
            .login-header {
                text-align: center;
                margin-bottom: 1.5rem;
            }
            .login-header sl-icon {
                font-size: 3rem;
                color: var(--sl-color-primary-600);
            }
            .login-header h1 {
                font-size: 1.5rem;
                margin-top: 0.5rem;
            }
            .login-header p {
                color: var(--sl-color-neutral-500);
                font-size: 0.9rem;
                margin-top: 0.25rem;
            }
            .login-form {
                display: flex;
                flex-direction: column;
                gap: 1rem;
            }
            .login-form sl-button {
                width: 100%;
            }
            #login-error {
                display: none;
            }
        </style>
    </head>
    <body>
        <main class="login-container">
            <div class="login-header">
                <sl-icon name="box-seam"></sl-icon>
                <h1>Moombox</h1>
                <p>Enter your password to continue</p>
            </div>

            <sl-alert id="login-error" variant="danger" open>
                <sl-icon slot="icon" name="exclamation-octagon"></sl-icon>
                <span id="login-error-text">Invalid password</span>
            </sl-alert>

            <div class="login-form">
                <sl-input
                    id="login-password"
                    name="password"
                    type="password"
                    label="Password"
                    placeholder="Enter password"
                    required
                    autofocus
                    toggle-password
                    autocomplete="current-password"
                ></sl-input>
                <sl-button id="login-submit" variant="primary">
                    <sl-icon slot="prefix" name="box-arrow-in-right"></sl-icon>
                    Login
                </sl-button>
            </div>
        </main>

        <script src="/login.js"></script>
    </body>
</html>
