<!doctype html>
<html lang="en" class="sl-theme-dark">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="robots" content="noindex,nofollow" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="referrer" content="no-referrer" />
        <meta name="theme-color" content="#1C1B22" />
        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
        <title>Moombox - Login</title>

        <!-- Theme bootstrap — runs before stylesheets resolve to avoid FOUC on light theme.
             Mirrors the logic in app.js setTheme() so a returning user sees their saved
             preference on first paint instead of the dark-themed default flashing first. -->
        <script>
            (function () {
                try {
                    var saved = localStorage.getItem("moombox-theme");
                    var theme = saved || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
                    document.documentElement.className = theme === "light" ? "sl-theme-light" : "sl-theme-dark";
                    var meta = document.querySelector('meta[name="theme-color"]');
                    if (meta) meta.content = theme === "light" ? "#ffffff" : "#1C1B22";
                    window.__moomboxBootTheme = theme;
                } catch (e) {
                    // localStorage/matchMedia unavailable — leave default sl-theme-dark class intact.
                }
            })();
        </script>

        <!-- Shoelace UI Components — SRI-pinned; hashes match those in index.html.
             Both themes loaded so the preference-aware bootstrap above can pick. -->
        <link
            rel="stylesheet"
            id="sl-theme-dark"
            href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.16.0/cdn/themes/dark.css"
            integrity="sha384-GWYIqFA394qpD/MvZTDi2pLPBjEux2y3wDvsvEa/s+DXOt1YxPYCRsisFUKlaJf/"
            crossorigin="anonymous"
        />
        <link
            rel="stylesheet"
            id="sl-theme-light"
            href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.16.0/cdn/themes/light.css"
            crossorigin="anonymous"
            media="not all"
        />
        <script>
            // Swap which theme stylesheet is active based on the bootstrap result above.
            (function () {
                var theme = window.__moomboxBootTheme;
                if (theme !== "light") return;
                var dark = document.getElementById("sl-theme-dark");
                var light = document.getElementById("sl-theme-light");
                if (dark) dark.media = "not all";
                if (light) light.media = "";
            })();
        </script>
        <script
            type="module"
            src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.16.0/cdn/shoelace-autoloader.js"
            integrity="sha384-t9SlygVzod2/NhAjzDBVhkqxTeKE4e4iLm3A92sOlUqH45sU5iLLtITVxFum3Fyi"
            crossorigin="anonymous"
        ></script>

        <style>
            * { box-sizing: border-box; margin: 0; padding: 0; }
            body {
                font-family: var(--sl-font-sans);
                /* Follow the active Shoelace theme tokens instead of hardcoding dark #1C1B22. */
                background: var(--sl-color-neutral-0);
                color: var(--sl-color-neutral-900);
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                /* dvh tracks the visible viewport as mobile browser chrome collapses/expands. */
                min-height: 100dvh;
                padding: 1rem;
            }
            .login-container {
                background: var(--sl-color-neutral-50);
                border-radius: var(--sl-border-radius-large);
                padding: 2rem;
                width: 100%;
                max-width: 380px;
                min-width: 0;
                box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
            }
            .login-header {
                text-align: center;
                margin-bottom: 1.5rem;
            }
            .login-header sl-icon {
                font-size: 3rem;
                color: var(--sl-color-primary-600);
            }
            .login-header h1 {
                font-size: 1.5rem;
                margin-top: 0.5rem;
            }
            .login-header p {
                color: var(--sl-color-neutral-500);
                font-size: 0.9rem;
                margin-top: 0.25rem;
            }
            .login-form {
                display: flex;
                flex-direction: column;
                gap: 1rem;
            }
            .login-form sl-button {
                width: 100%;
            }
            #login-error {
                display: none;
            }
        </style>
    </head>
    <body>
        <main class="login-container">
            <div class="login-header">
                <sl-icon name="box-seam"></sl-icon>
                <h1>Moombox</h1>
                <p>Enter your password to continue</p>
            </div>

            <sl-alert id="login-error" variant="danger" open>
                <sl-icon slot="icon" name="exclamation-octagon"></sl-icon>
                <span id="login-error-text">Invalid password</span>
            </sl-alert>

            <div class="login-form">
                <sl-input
                    id="login-password"
                    name="password"
                    type="password"
                    label="Password"
                    placeholder="Enter password"
                    required
                    autofocus
                    toggle-password
                    autocomplete="current-password"
                ></sl-input>
                <sl-button id="login-submit" variant="primary">
                    <sl-icon slot="prefix" name="box-arrow-in-right"></sl-icon>
                    Login
                </sl-button>
            </div>
        </main>

        <script>
            document.addEventListener("DOMContentLoaded", () => {
                const passwordInput = document.getElementById("login-password");
                const submitBtn = document.getElementById("login-submit");
                const errorAlert = document.getElementById("login-error");
                const errorText = document.getElementById("login-error-text");

                async function doLogin() {
                    if (submitBtn.disabled) return;
                    const password = passwordInput.value;
                    if (!password) {
                        passwordInput.focus();
                        return;
                    }

                    submitBtn.loading = true;
                    submitBtn.disabled = true;
                    errorAlert.style.display = "none";

                    let success = false;
                    try {
                        const response = await fetch("/api/auth/login", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ password }),
                        });

                        if (response.ok) {
                            // Redirect to dashboard — keep button in loading state
                            // to avoid a flicker before navigation completes
                            success = true;
                            window.location.href = "/";
                        } else {
                            const data = await response.json().catch(() => ({ error: response.statusText }));
                            errorText.textContent = data.error || "Login failed";
                            // "block", not "" — clearing the inline style falls back
                            // to the stylesheet's #login-error { display: none; }
                            errorAlert.style.display = "block";
                            passwordInput.value = "";
                            passwordInput.focus();
                        }
                    } catch (e) {
                        errorText.textContent = "Connection error: " + e.message;
                        errorAlert.style.display = "block";
                    } finally {
                        if (!success) {
                            submitBtn.loading = false;
                            submitBtn.disabled = false;
                        }
                    }
                }

                submitBtn.addEventListener("click", doLogin);
                passwordInput.addEventListener("keydown", (e) => {
                    if (e.key === "Enter") doLogin();
                });
            });
        </script>
    </body>
</html>
