version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      charm:
        patterns:
          - "charm.land/*"
          - "github.com/charmbracelet/*"
      go-stdlib:
        patterns:
          - "golang.org/x/*"
      modernc:
        patterns:
          - "modernc.org/*"

  - package-ecosystem: npm
    directory: /bgutil-sidecar
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # meriyah and astring are version-lockstepped with the vendored ejs
      # solver (bgutil-sidecar/vendor/ejs/) — bumped manually whenever
      # upstream ejs moves its own pins, never independently.
      - dependency-name: meriyah
      - dependency-name: astring

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
