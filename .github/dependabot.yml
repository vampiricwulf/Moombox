version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      charm:
        patterns:
          - "charm.land/*"
          - "github.com/charmbracelet/*"
      go-stdlib:
        patterns:
          - "golang.org/x/*"
      modernc:
        patterns:
          - "modernc.org/*"

  - package-ecosystem: npm
    directory: /bgutil-sidecar
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
