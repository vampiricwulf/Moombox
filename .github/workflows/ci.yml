name: CI

# Build, lint, and test on every push to main and every pull request, on
# both desktop platforms Moombox ships for. Also callable: release.yml runs
# this workflow as its `test` job on the tagged commit, beside the release
# rather than ahead of it — the result is reported in the release's run, and
# a red suite does not hold the release back.
#
# Shape: independent jobs that all start at once, so a run takes as long as
# its slowest job rather than the sum of every step (it used to be one
# serial job per OS: ~13 minutes on ubuntu, ~8 on windows).
#
#   lint   every gate that only compiles: gofmt / `go mod tidy -diff` /
#          go vet for linux/amd64, windows/amd64 and linux/arm64 / the
#          modernc.org/libc pin check / the Dockerfile Go-version check /
#          staticcheck for linux and windows / go build and the
#          windows/amd64 and linux/arm64 cross-builds / the test-shard
#          check. Compiling needs no real embed blobs, so empty files stand
#          in for them (as in vuln-scan.yml): no Node download, no sidecar
#          build, no FFmpeg.
#   js     bgutil-sidecar's `npm test` and the frontend suite (`node --test`
#          in web/tests after its own `npm ci`, so jsdom is present). No Go.
#   test   the Go suite, `go test -count=1`, in three flavours, each split
#          by package into shards that run side by side:
#            linux    go test on ubuntu
#            race     go test -race on ubuntu, over the whole module
#            windows  go test on windows (the Windows-only code — DPAPI
#                     cookie reading, Job Objects, cookie profile paths —
#                     has tests that skip everywhere else)
#          .github/scripts/test-shard.sh says which packages each shard
#          runs. Every flavour has a catch-all shard, rest, so a new package
#          always runs somewhere, and lint proves the shards cover
#          `go list ./...` exactly once. Every shard installs FFmpeg (in the
#          background while the rest of its setup runs), so
#          muxer_concatcopy_test.go and probe_params_test.go run instead of
#          skipping, and builds the sidecar payload from the commit under
#          test.
#
# Caches. Each flavour (lint, linux, race, windows) keeps its own Go cache —
# GOCACHE plus the module zips — keyed by flavour, Go version and go.sum.
# setup-go's own cache (off here) has one key per runner OS: whichever job
# saved first would decide what every job on that OS restores (lint's build
# holds no race-instrumented package, a race shard's no plain one), and the
# others would race to save the same entry. One job per flavour
# saves it (lint itself, and each flavour's rest shard), only on a push to
# main — the one branch whose caches every later run can read — and only
# when its key missed. The three pinned Node binaries are cached per OS
# (~1 min of nodejs.org downloads on a miss). The sidecar tarball is rebuilt
# on every run and never cached: it is seconds of work, and a cached one made
# the Go tests embed the PREVIOUS sidecar JS whenever a commit touched only
# bgutil-sidecar/src or vendor/ejs, which the old key did not hash.
#
# Network steps are bounded. Every installer and download runs through
# .github/scripts/retry.sh (a time limit per attempt, three attempts) inside
# a step timeout, and every job has a timeout of its own: apt gives up only
# on total silence, so a mirror that trickled bytes once hung a run for 22
# minutes, and a proxy that reset one HTTP/2 stream once failed
# `go mod tidy`.
#
# staticcheck is a hard gate, pinned to a release rather than @latest:
# staticcheck lags Go releases, and an unpinned install can refuse to build
# against a new toolchain the morning go.mod moves to it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# github.workflow is the CALLER's name when release.yml calls this, which
# keeps a release dry run started from main out of the group a push to main
# uses — otherwise each would cancel the other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # A cache download that stalls is abandoned after this many minutes and
  # the job carries on as on a miss (actions/cache's own default is 10).
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: '3'

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Stand in for the embed blobs
        # vet, staticcheck and the builds load every package, and a package
        # does not load without the files its go:embed directives name. They
        # read code, never the embedded bytes, so an empty file replaces each
        # named file the checkout lacks: the sidecar tarball and the three
        # Node binaries, found from the directives rather than listed here,
        # so a blob added for another platform is covered too.
        run: |
          git grep -l -e '^//go:embed ' -- '*.go' | while read -r file; do
            dir=$(dirname "$file")
            sed -n 's|^//go:embed ||p' "$file" | tr ' ' '\n' | while read -r name; do
              case $name in '' | *[*?[]*) continue ;; esac
              if [ ! -e "$dir/$name" ]; then
                : > "$dir/$name"
                echo "empty stand-in: $dir/$name"
              fi
            done
          done

      - uses: actions/setup-go@v7
        id: setup-go
        with:
          go-version-file: go.mod
          cache: false

      - name: Locate the Go caches
        id: cache-dirs
        run: |
          {
            echo "gocache=$(go env GOCACHE)"
            echo "gomodcache=$(go env GOMODCACHE)"
          } >> "$GITHUB_OUTPUT"

      - name: Restore the Go caches (lint)
        id: go-cache
        uses: actions/cache/restore@v6
        timeout-minutes: 5
        continue-on-error: true
        with:
          path: |
            ${{ steps.cache-dirs.outputs.gocache }}
            ${{ steps.cache-dirs.outputs.gomodcache }}/cache/download
            ~/.cache/staticcheck
          key: go-lint-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-lint-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-

      - name: Download Go modules and staticcheck
        # Everything the later steps fetch, fetched here where a failure is
        # retried. Beyond the build list, `go mod tidy` reads the modules the
        # tests of dependencies import; tidying a scratch copy of go.mod and
        # go.sum (-modfile) downloads exactly those and leaves the real files
        # alone, so the tidy check needs no network and a genuine tidy diff
        # is never retried.
        timeout-minutes: 10
        run: |
          bash .github/scripts/retry.sh 3 300 go mod download
          mkdir -p "$RUNNER_TEMP/tidy"
          cp go.mod go.sum "$RUNNER_TEMP/tidy/"
          bash .github/scripts/retry.sh 3 300 go mod tidy -modfile="$RUNNER_TEMP/tidy/go.mod"
          bash .github/scripts/retry.sh 3 300 go install honnef.co/go/tools/cmd/staticcheck@2026.2.2

      - name: gofmt
        run: |
          out="$(gofmt -l ./cmd ./internal ./tools ./web)"
          if [ -n "$out" ]; then
            echo "gofmt would reformat:"; echo "$out"; exit 1
          fi

      - name: go mod tidy check
        # Usable only because .gitattributes pins go.mod/go.sum to LF: under
        # core.autocrlf=true the working-tree CRLF made `-diff` emit the whole
        # file with no content change.
        run: go mod tidy -diff

      - name: go vet (linux/amd64)
        run: go vet ./...

      - name: go vet (windows/amd64)
        env:
          GOOS: windows
          GOARCH: amd64
        run: go vet ./...

      - name: go vet (linux/arm64)
        env:
          GOOS: linux
          GOARCH: arm64
        run: go vet ./...

      - name: modernc.org/libc pin matches the sqlite driver
        # modernc.org/sqlite's doc.go requires downstream modules to pin the
        # EXACT libc version its own go.mod names (gitlab.com/cznic/sqlite#177).
        # A `go get -u` sweep broke that once and nothing noticed until a
        # code review: build, vet, staticcheck and the full suite were all
        # green with the wrong pin. This is the gate that notices.
        run: |
          ours=$(go list -m -f '{{.Version}}' modernc.org/libc)
          want=$(sed -n 's#^[[:space:]]*modernc.org/libc \(v[^ ]*\).*#\1#p' "$(go list -m -f '{{.GoMod}}' modernc.org/sqlite)")
          if [ "$ours" != "$want" ]; then
            echo "modernc.org/libc is $ours but modernc.org/sqlite pins $want"
            echo "Bump modernc.org/sqlite (preferred) or match its libc pin exactly."
            exit 1
          fi
          echo "libc pin OK: $ours"

      - name: Dockerfile builds with the Go version go.mod requires
        # The image's build stage is `golang:<major.minor>-bookworm`, and Go
        # inside that image does not download a newer toolchain. Moving
        # go.mod's `go` line without moving the Dockerfile breaks only the
        # image build — which no push or pull request runs, so it surfaced
        # at release time. This is the gate that notices earlier.
        run: |
          want=$(sed -n 's/^go \([0-9][0-9]*\.[0-9][0-9]*\).*/\1/p' go.mod)
          got=$(sed -n 's/^FROM .*golang:\([0-9][0-9]*\.[0-9][0-9]*\)[-.].*/\1/p' Dockerfile)
          if [ -z "$want" ] || [ "$want" != "$got" ]; then
            echo "go.mod requires Go \"$want\" but the Dockerfile's build stage is golang:\"$got\""
            echo "Move the Dockerfile's FROM golang:... line together with go.mod's go directive."
            exit 1
          fi
          echo "Dockerfile Go version OK: $got"

      - name: staticcheck (linux/amd64)
        run: staticcheck ./...

      - name: staticcheck (windows/amd64)
        env:
          GOOS: windows
          GOARCH: amd64
        run: staticcheck ./...

      - name: go build
        run: go build ./...

      # go build of several packages links each main package (cmd/moombox
      # among them) and discards the result, so one command covers both
      # the libraries and the binary.
      - name: Cross-build windows/amd64
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: go build ./...

      - name: Cross-build linux/arm64
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: arm64
        run: go build ./...

      - name: Test shards cover every package exactly once
        # The test job's matrix and test-shard.sh's layout must agree, and
        # each flavour's shards must be `go list ./...` for that flavour's
        # GOOS, with no package missing and none twice.
        run: bash .github/scripts/test-shard.sh --check

      - name: Save the Go caches (lint)
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        timeout-minutes: 5
        continue-on-error: true
        with:
          path: |
            ${{ steps.cache-dirs.outputs.gocache }}
            ${{ steps.cache-dirs.outputs.gomodcache }}/cache/download
            ~/.cache/staticcheck
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  js:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            bgutil-sidecar/package-lock.json
            web/tests/package-lock.json

      - name: Build the sidecar for its tests
        # The sidecar suite needs node_modules (devDependencies included) and
        # vendor/ejs.bundle.js (esbuild's output, imported by src/cipher.js,
        # which the tests import transitively via src/server.js). build.mjs
        # writes the bundle and restores the devDependencies it pruned for
        # the tarball. --ignore-scripts: a compromised dep's postinstall
        # could exfiltrate GITHUB_TOKEN; jsdom + bgutils-js have no install
        # scripts we need.
        working-directory: bgutil-sidecar
        timeout-minutes: 10
        run: |
          bash ../.github/scripts/retry.sh 3 300 npm ci --no-audit --no-fund --ignore-scripts
          node build.mjs

      - name: Sidecar test suite
        # bgutil-sidecar's wired `npm test` covers the homepage-ytcfg
        # extraction and minter keying — the logic behind the open
        # premiere-attestation field gate.
        working-directory: bgutil-sidecar
        timeout-minutes: 5
        run: npm test

      - name: Frontend test suite
        working-directory: web/tests
        timeout-minutes: 10
        run: |
          bash ../../.github/scripts/retry.sh 3 300 npm ci --no-audit --no-fund --ignore-scripts
          node --test ./*.test.mjs

  test:
    name: ${{ matrix.flavour }} (${{ matrix.shard }})
    runs-on: ${{ matrix.flavour == 'windows' && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # One row per flavour/shard, written exactly as `- { flavour: F,
        # shard: S }`: test-shard.sh --check (in lint) reads these rows and
        # fails unless they are the shards the script defines. The longest
        # shards come first, so they are the first to get a runner.
        include:
          - { flavour: windows, shard: worker }
          - { flavour: race, shard: worker }
          - { flavour: linux, shard: worker }
          - { flavour: windows, shard: cookies }
          - { flavour: windows, shard: engine }
          - { flavour: windows, shard: web }
          - { flavour: race, shard: web }
          - { flavour: race, shard: engine }
          - { flavour: windows, shard: rest }
          - { flavour: race, shard: rest }
          - { flavour: linux, shard: rest }
    env:
      FLAVOUR: ${{ matrix.flavour }}
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v7

      - name: Start installing FFmpeg
        # apt on ubuntu, choco on windows: 20-40 s that needs nothing the
        # setup steps below make, so it runs in the background while they
        # do, and "Finish installing FFmpeg" waits for it before go test.
        # Every network command in it is bounded and retried (see the
        # script: apt's own timeout fires only on total silence).
        timeout-minutes: 10
        run: bash .github/scripts/install-ffmpeg.sh --start

      - name: Restore embedded Node binary cache
        # The Node binaries ONLY — sidecar.tar.gz must never be added to this
        # path list (see the header). Their whole input is the pin: version.txt
        # plus the fetch tool that carries the SHA-256s and the download logic.
        # runner.os is in the key because an archive saved on one runner OS is
        # not restored on the other.
        id: cache-node
        uses: actions/cache/restore@v6
        timeout-minutes: 5
        continue-on-error: true
        with:
          path: |
            internal/bgutils/embed/node-windows-amd64.gz
            internal/bgutils/embed/node-linux-amd64.gz
            internal/bgutils/embed/node-linux-arm64.gz
          key: embed-node-${{ runner.os }}-${{ hashFiles('internal/bgutils/embed/version.txt', 'tools/fetch-node/main.go') }}

      - uses: actions/setup-go@v7
        id: setup-go
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Locate the caches
        id: cache-dirs
        run: |
          {
            echo "gocache=$(go env GOCACHE)"
            echo "gomodcache=$(go env GOMODCACHE)"
            echo "npm=$(npm config get cache)"
          } >> "$GITHUB_OUTPUT"

      - name: Restore the Go caches (${{ matrix.flavour }})
        id: go-cache
        uses: actions/cache/restore@v6
        timeout-minutes: 5
        continue-on-error: true
        with:
          path: |
            ${{ steps.cache-dirs.outputs.gocache }}
            ${{ steps.cache-dirs.outputs.gomodcache }}/cache/download
          key: go-${{ matrix.flavour }}-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ matrix.flavour }}-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-

      - name: Restore the npm cache
        id: npm-cache
        uses: actions/cache/restore@v6
        timeout-minutes: 5
        continue-on-error: true
        with:
          path: ${{ steps.cache-dirs.outputs.npm }}
          key: npm-sidecar-${{ runner.os }}-${{ hashFiles('bgutil-sidecar/package-lock.json') }}

      - name: Download Go modules
        timeout-minutes: 10
        run: bash .github/scripts/retry.sh 3 300 go mod download

      - name: Build BotGuard sidecar payload
        # --ignore-scripts: a compromised dep's postinstall could exfiltrate
        # GITHUB_TOKEN; jsdom + bgutils-js have no install scripts we need.
        # Unconditional: every Go test embeds this tarball, so it is built
        # from the commit under test, never restored.
        working-directory: bgutil-sidecar
        timeout-minutes: 10
        run: |
          bash ../.github/scripts/retry.sh 3 300 npm ci --no-audit --no-fund --ignore-scripts
          node build.mjs

      - name: Fetch embedded Node binaries (all platforms)
        id: fetch-node
        if: steps.cache-node.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: bash .github/scripts/retry.sh 3 300 go run ./tools/fetch-node

      - name: Finish installing FFmpeg
        # Prints the background install's log and fails the job if it
        # failed, so muxer_concatcopy_test.go and probe_params_test.go run
        # instead of skipping.
        timeout-minutes: 10
        run: bash .github/scripts/install-ffmpeg.sh --wait

      - name: go test
        # -timeout is go test's limit for one test binary: past it, the
        # binary dumps every goroutine and fails, which is what names a
        # deadlocked test (one that hangs only under the race detector's
        # scheduling, say). It is under this step's timeout by more than a
        # cold compile takes, so the dump always lands before the step is
        # cut off, and still more than twice the slowest binary's run on
        # any runner (internal/worker on windows, 205 s at worst). Under
        # -race, a test that budgets allocations or fits its probe inside
        # one wall-clock second either widens its gate or skips (each such
        # package's raceEnabled constant): the detector's instrumentation is
        # not the code it budgets, and the linux flavour still runs it.
        timeout-minutes: 11
        run: |
          pkgs=$(bash .github/scripts/test-shard.sh "$FLAVOUR/$SHARD")
          echo "::group::$FLAVOUR/$SHARD: $(grep -c . <<<"$pkgs") package(s)"
          echo "$pkgs"
          echo "::endgroup::"
          flags=(-count=1 -timeout=8m)
          if [ "$FLAVOUR" = race ]; then flags+=(-race); fi
          # shellcheck disable=SC2086 # one import path per line, no spaces
          go test "${flags[@]}" $pkgs

      # Each flavour's rest shard saves the Go cache all of its shards
      # restore. Its own tests compile every third-party package the
      # flavour's other shards need but a handful of small ones, and the
      # module's own packages in the cache go stale with the next commit
      # anyway (the key moves with go.sum, not with the code), so nothing
      # compiles extra for the cache.
      - name: Save the Go caches (${{ matrix.flavour }})
        if: ${{ !cancelled() && matrix.shard == 'rest' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        timeout-minutes: 5
        continue-on-error: true
        with:
          path: |
            ${{ steps.cache-dirs.outputs.gocache }}
            ${{ steps.cache-dirs.outputs.gomodcache }}/cache/download
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

      # The Node binaries and the npm cache are per runner OS, shared by the
      # flavours there: linux's rest saves them on ubuntu (race only
      # restores), windows's rest on windows.
      - name: Save the embedded Node binary cache
        if: ${{ !cancelled() && matrix.shard == 'rest' && matrix.flavour != 'race' && steps.fetch-node.outcome == 'success' }}
        uses: actions/cache/save@v6
        timeout-minutes: 5
        continue-on-error: true
        with:
          path: |
            internal/bgutils/embed/node-windows-amd64.gz
            internal/bgutils/embed/node-linux-amd64.gz
            internal/bgutils/embed/node-linux-arm64.gz
          key: ${{ steps.cache-node.outputs.cache-primary-key }}

      - name: Save the npm cache
        if: ${{ !cancelled() && matrix.shard == 'rest' && matrix.flavour != 'race' && steps.npm-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        timeout-minutes: 5
        continue-on-error: true
        with:
          path: ${{ steps.cache-dirs.outputs.npm }}
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}
