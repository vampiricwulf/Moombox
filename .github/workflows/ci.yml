name: CI

# Build, lint, and test on every push to main and every pull request, on
# both desktop platforms Moombox ships for. release.yml only runs on tag
# push and never runs the tests; before this workflow existed the suite
# ran only on developer machines.
#
# Shape:
#   - matrix over ubuntu-latest + windows-latest (the Windows-only code —
#     DPAPI cookie reading, Job Objects, cookie profile paths — has tests
#     that skip everywhere else)
#   - the same embed-blob cache as release.yml (plus runner.os, because the
#     sidecar tarball is built per runner); on a miss the sidecar payload
#     and the pinned Node binaries are rebuilt, ~1 min
#   - FFmpeg installed so muxer_concatcopy_test.go and probe_params_test.go
#     stop skipping
#   - gofmt / vet / staticcheck / build / full `go test`; ubuntu also
#     cross-builds linux/arm64 and runs the node suite in web/tests
#
# staticcheck is a hard gate, pinned to a release rather than @latest:
# staticcheck lags Go releases, and an unpinned install can refuse to build
# against a new toolchain the morning go.mod moves to it.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Restore embed blob cache
        # Same inputs as release.yml's key, plus the runner OS: the three
        # Node binaries are identical everywhere but the sidecar tarball is
        # produced by the runner's own tar.
        id: cache-embed
        uses: actions/cache@v6
        with:
          path: |
            internal/bgutils/embed/sidecar.tar.gz
            internal/bgutils/embed/node-windows-amd64.gz
            internal/bgutils/embed/node-linux-amd64.gz
            internal/bgutils/embed/node-linux-arm64.gz
          key: embed-${{ runner.os }}-${{ hashFiles('internal/bgutils/embed/version.txt', 'bgutil-sidecar/package-lock.json', 'bgutil-sidecar/build.mjs', 'tools/fetch-node/main.go') }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          # Both npm projects in the repo: the sidecar payload built on a
          # cache miss, and web/tests' node suite whose `npm ci` runs on
          # EVERY Linux run and is covered by no other cache key (the
          # embed-blob cache keys off bgutil-sidecar/package-lock.json).
          cache: npm
          cache-dependency-path: |
            bgutil-sidecar/package-lock.json
            web/tests/package-lock.json

      - name: Build BotGuard sidecar payload
        # --ignore-scripts: a compromised dep's postinstall could exfiltrate
        # GITHUB_TOKEN; jsdom + bgutils-js have no install scripts we need.
        if: steps.cache-embed.outputs.cache-hit != 'true'
        working-directory: bgutil-sidecar
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          node build.mjs

      - name: Fetch embedded Node binaries (all platforms)
        if: steps.cache-embed.outputs.cache-hit != 'true'
        run: go run ./tools/fetch-node

      - name: Install FFmpeg (ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Install FFmpeg (windows)
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg -y --no-progress
          ffmpeg -version | head -1

      - name: gofmt
        run: |
          out="$(gofmt -l ./cmd ./internal ./tools ./web)"
          if [ -n "$out" ]; then
            echo "gofmt would reformat:"; echo "$out"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: modernc.org/libc pin matches the sqlite driver
        # modernc.org/sqlite's doc.go requires downstream modules to pin the
        # EXACT libc version its own go.mod names (gitlab.com/cznic/sqlite#177).
        # A `go get -u` sweep broke that once and nothing noticed until a
        # code review: build, vet, staticcheck and the full suite were all
        # green with the wrong pin. This is the gate that notices.
        run: |
          ours=$(go list -m -f '{{.Version}}' modernc.org/libc)
          want=$(sed -n 's#^[[:space:]]*modernc.org/libc \(v[^ ]*\).*#\1#p' "$(go list -m -f '{{.GoMod}}' modernc.org/sqlite)")
          if [ "$ours" != "$want" ]; then
            echo "modernc.org/libc is $ours but modernc.org/sqlite pins $want"
            echo "Bump modernc.org/sqlite (preferred) or match its libc pin exactly."
            exit 1
          fi
          echo "libc pin OK: $ours"

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
          staticcheck ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -count=1 ./...

      - name: go test -race (logger, database, web)
        # Owner ruling O-P. Three cheap packages, Linux only — the Windows
        # leg is unchanged. internal/logger's lock-hierarchy comment, and the
        # "run under -race" instructions in nine other test files, had never
        # been checked by anything: `grep -rn -- "-race" .github/ docs/
        # SPEC.md CLAUDE.md` returned zero hits before this step existed.
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./internal/logger/... ./internal/database/... ./internal/web/...

      - name: Cross-build linux/arm64
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: arm64
        run: go build -o /dev/null ./cmd/moombox

      - name: Sidecar test suite
        # bgutil-sidecar's wired `npm test` covers the homepage-ytcfg
        # extraction and minter keying — the logic behind the open
        # premiere-attestation field gate — and until now no workflow ran it.
        # The `npm ci` guard is required because the sidecar build step above
        # is skipped on an embed-cache HIT, which leaves node_modules absent.
        if: runner.os == 'Linux'
        working-directory: bgutil-sidecar
        run: |
          [ -d node_modules ] || npm ci --no-audit --no-fund --ignore-scripts
          npm test

      - name: Frontend test suite
        if: runner.os == 'Linux'
        working-directory: web/tests
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          node --test ./*.test.mjs
