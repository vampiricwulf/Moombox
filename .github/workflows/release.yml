name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Windows executable
        env:
          CGO_ENABLED: 0
          GOOS: windows
          GOARCH: amd64
        run: |
          $version = "${{ github.ref_name }}"
          $commit = git rev-parse --short HEAD
          go build -ldflags "-s -w -X main.version=$version -X main.commit=$commit" -o Moombox.exe ./cmd/moombox

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: moombox-exe
          path: Moombox.exe

  release-notes:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate release notes with Claude Code CLI
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # Get commit log since previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" -20)
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" "$PREV_TAG"..HEAD)
          fi

          npm install -g @anthropic-ai/claude-code

          PROMPT="You are writing release notes for Moombox version ${TAG_NAME}, a YouTube/Twitch live stream archiver written in Go. Given the following git commits, write concise, user-friendly release notes. Group changes into sections like **Features**, **Improvements**, **Bug Fixes**, and **Internal** as appropriate. Skip any section that has no entries. Focus on what matters to users. Do not include a version heading — start directly with the sections. Use markdown formatting. Output ONLY the markdown, nothing else.

          Commits:
          ${COMMITS}"

          claude --model claude-opus-4-6 -p "$PROMPT" --output-format text > /tmp/release_body.md || true

      - name: Build final release notes
        env:
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          DOWNLOAD_LINK="[**\`Download Moombox.exe for Windows (x64)\`**](https://github.com/${REPO}/releases/download/${TAG_NAME}/Moombox.exe)"

          if [ -f /tmp/release_body.md ] && [ -s /tmp/release_body.md ]; then
            {
              echo "$DOWNLOAD_LINK"
              echo ""
              echo "---"
              echo ""
              cat /tmp/release_body.md
              echo ""
              echo "---"
              echo "*Release notes generated by Claude Opus 4.6*"
            } > release_notes.md
            echo "use_github_notes=false" >> "$GITHUB_ENV"
          else
            echo "$DOWNLOAD_LINK" > release_notes.md
            echo "use_github_notes=true" >> "$GITHUB_ENV"
          fi

      - name: Download exe artifact
        uses: actions/download-artifact@v4
        with:
          name: moombox-exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          generate_release_notes: ${{ env.use_github_notes == 'true' }}
          files: Moombox.exe
