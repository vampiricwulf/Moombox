name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Windows executable
        env:
          CGO_ENABLED: 0
          GOOS: windows
          GOARCH: amd64
        run: |
          $version = "${{ github.ref_name }}"
          $commit = git rev-parse --short HEAD
          go build -ldflags "-s -w -X main.version=$version -X main.commit=$commit" -o Moombox.exe ./cmd/moombox

      - name: Build release body
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          DOWNLOAD_LINK="[**\`Download Moombox.exe for Windows (x64)\`**](https://github.com/${REPO}/releases/download/${TAG_NAME}/Moombox.exe)"

          if [ -f RELEASE_NOTES.md ] && [ -s RELEASE_NOTES.md ]; then
            {
              echo "$DOWNLOAD_LINK"
              echo ""
              echo "---"
              echo ""
              cat RELEASE_NOTES.md
            } > release_body.md
            echo "use_github_notes=false" >> "$GITHUB_ENV"
          else
            echo "$DOWNLOAD_LINK" > release_body.md
            echo "use_github_notes=true" >> "$GITHUB_ENV"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_body.md
          generate_release_notes: ${{ env.use_github_notes == 'true' }}
          files: Moombox.exe
