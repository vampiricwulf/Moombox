name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run package

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: moombox-exe
          path: Moombox.exe

  release-notes:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get commit log
        id: commits
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" -20)
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" "$PREV_TAG"..HEAD)
          fi
          # Write to file for Claude to read
          echo "$COMMITS" > /tmp/commits.txt

      - name: Generate release notes with Claude
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--model claude-opus-4-6'
          prompt: |
            Read the file /tmp/commits.txt which contains git commits for Moombox version ${{ github.ref_name }}.

            Moombox is a YouTube live stream archiver with a web dashboard and TUI.

            Write concise, user-friendly release notes. Group changes into sections like
            **Features**, **Improvements**, **Bug Fixes**, and **Internal** as appropriate.
            Skip any section that has no entries. Focus on what matters to users.
            Do not include a version heading — start directly with the sections.
            Use markdown formatting.

            Write ONLY the release notes content to a file at /tmp/release_body.md — no other output.

      - name: Build final release notes
        env:
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          DOWNLOAD_LINK="[**\`📦 Download Moombox.exe for Windows\`**](https://github.com/${REPO}/releases/download/${TAG_NAME}/Moombox.exe)"

          if [ -f /tmp/release_body.md ] && [ -s /tmp/release_body.md ]; then
            {
              echo "$DOWNLOAD_LINK"
              echo ""
              echo "---"
              echo ""
              cat /tmp/release_body.md
              echo ""
              echo "---"
              echo "*Release notes generated by Claude Opus 4.6*"
            } > release_notes.md
            echo "use_github_notes=false" >> "$GITHUB_ENV"
          else
            echo "$DOWNLOAD_LINK" > release_notes.md
            echo "use_github_notes=true" >> "$GITHUB_ENV"
          fi

      - name: Download exe artifact
        uses: actions/download-artifact@v4
        with:
          name: moombox-exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          generate_release_notes: ${{ env.use_github_notes == 'true' }}
          files: Moombox.exe
