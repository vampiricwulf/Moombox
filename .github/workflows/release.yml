name: Build and Release

on:
  push:
    tags:
      - 'v*'
  # Dry run. "Run workflow" on any ref runs every job below exactly as a
  # tag would — the test gate, the embed blobs, the three cross-builds, the
  # signing with its self-check, the multi-arch image build — and publishes
  # nothing: the image is not pushed, and the release upload goes to a
  # draft that the job deletes. This
  # workflow otherwise runs on tags alone, and a tag is never replaced, so
  # without this a break in it is found by the release it breaks and costs a
  # version number. The dry run's version is the one in cmd/moombox/main.go
  # with "-dryrun" appended.
  #
  # What publishes is the tag PUSH, not the tag: every gate below tests
  # github.event_name == 'push' (the only push this workflow listens for is
  # a v* tag). A manual run started ON a tag ref is therefore still a dry
  # run. Gating on ref_type alone would have let it rebuild and overwrite
  # that release's six assets and move "Latest" back to it.
  workflow_dispatch:

# Each job states what it needs; nothing is granted workflow-wide beyond read.
permissions:
  contents: read

# Three jobs:
#
#   test     ci.yml, called as a required job: the full suite on ubuntu and
#            windows for the tagged commit. v2.8.9 was published while CI on
#            the same commit was red — the two workflows ran side by side and
#            neither waited for the other. A flaky failure here is cleared
#            with "Re-run failed jobs" on the same tag.
#   release  the binaries (below), after test.
#   docker   docker-publish.yml, called after test AND release: the
#            multi-arch image, pushed only for a tag push. It waits for
#            release so a failed build or signature check cannot leave a
#            pushed `latest` image for a version that has no release.
#
# The release job is a single ubuntu-latest job that does everything:
#
#   1. Checkout + setup Go + setup Node
#   2. Build the embed blobs from the tagged commit, every time: the
#      sidecar payload (npm ci + build.mjs, ~3s) and the 3 pinned Node
#      binaries (fetch-node, SHA-256 verified, ~35s). Deliberately NOT
#      behind actions/cache. The cache this job used to carry never hit
#      (a cache saved by one tag's run is not readable from another
#      tag's — v2.8.3 through v2.8.10 all missed), and its key left out
#      bgutil-sidecar/src and vendor/ejs, so the day it did hit, a
#      release would have shipped the previous sidecar JS under a new
#      version number. A signed artifact is built from what the tag
#      contains, not from what an earlier run left behind.
#   3. go-winres setup — generates Windows .syso resources from
#      bash + jq + go-winres (which works on any host OS).
#   4. Cross-compile all 3 binaries SEQUENTIALLY, each in its own
#      named step (Win amd64, Linux amd64, Linux arm64). Earlier
#      attempt at 3-way parallel saved only ~8s on a 4-vCPU runner
#      because each build was already CPU-saturating, and introduced
#      footguns (parallel sign's bare `wait` swallowed exit codes;
#      parallel build raced on module cache and re-downloaded every
#      dep 3x). Per-step naming gives per-binary timing in the
#      Actions UI and easier failure attribution.
#   5. Sign all 3 binaries sequentially, each in its own named step.
#   6. Single softprops/action-gh-release@v3 call publishes the
#      release with body + all 6 assets in one shot. In a dry run the
#      same call uploads to a draft release that is then deleted.
#
# Single-job structure means no artifact upload/download cycle, no
# duplicated checkout + setup-go between phases, and the release
# only appears on GitHub once everything is ready (no window of
# released-with-broken-download-links). All-or-nothing semantics:
# any build/sign failure fails the whole release.

jobs:
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  docker:
    needs: [test, release]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      push: ${{ github.event_name == 'push' }}

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Compute version + ldflags
        # Computed once and exported via $GITHUB_ENV so the Windows resource
        # step and each per-binary build step reference the same
        # VERSION/COMMIT/LDFLAGS. Tag-derived; pre-release suffixes
        # (-test.N, -rc.N) are preserved in main.version since Go's
        # main.version isn't constrained to numeric like the Windows
        # resource metadata is. A dry run takes the version
        # cmd/moombox/main.go declares and marks it, even when it was
        # started on a tag ref.
        #
        # A tag must equal the declared version exactly (v2.6.0-test.1
        # declared "2.6.0-test.1"; every tag checked back to v2.8.3 matched).
        # A mismatch means the tag sits on the wrong commit or the bump
        # commit is missing — and RELEASE_NOTES.md at that commit is then the
        # PREVIOUS release's, which this job would publish under the new
        # version. Failing here publishes nothing: docker waits for this job.
        run: |
          set -euo pipefail
          DECLARED=$(sed -n 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' cmd/moombox/main.go | head -n 1)
          if [ -z "$DECLARED" ]; then
            echo "could not read the version from cmd/moombox/main.go"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if [ "$VERSION" != "$DECLARED" ]; then
              echo "Tag $GITHUB_REF_NAME does not match the version cmd/moombox/main.go declares at this commit (\"$DECLARED\")."
              echo "The tag is on the wrong commit, or the version bump was not committed. Nothing was published."
              exit 1
            fi
            RELEASE_TAG="$GITHUB_REF_NAME"
            RELEASE_DRAFT=false
          else
            VERSION="${DECLARED}-dryrun"
            # The upload step runs in a dry run too, against a draft release
            # under a name no tag will ever have; the step after it deletes it.
            RELEASE_TAG="dryrun-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            RELEASE_DRAFT=true
          fi
          COMMIT=$(git rev-parse --short HEAD)
          {
            echo "VERSION=$VERSION"
            echo "COMMIT=$COMMIT"
            echo "RELEASE_TAG=$RELEASE_TAG"
            echo "RELEASE_DRAFT=$RELEASE_DRAFT"
            echo "LDFLAGS=-s -w -X main.version=$VERSION -X main.commit=$COMMIT"
          } >> "$GITHUB_ENV"

      # No `cache: npm`: its key never matched the one ci.yml saves on main
      # (that one hashes two lockfiles), so every release missed and then
      # saved a copy under its own tag ref that nothing could read.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Build BotGuard sidecar payload
        # --ignore-scripts: a compromised dep's postinstall could
        # exfiltrate GITHUB_TOKEN; jsdom + bgutils-js have no install
        # scripts we depend on, so ignoring is safe.
        run: |
          cd bgutil-sidecar
          npm ci --no-audit --no-fund --ignore-scripts
          node build.mjs
          cd ..

      - name: Fetch embedded Node binaries (all platforms)
        # Downloads pinned Node v24 LTS binaries for Windows x64, Linux x64,
        # and Linux arm64; verifies SHA-256; gzips to per-platform embed
        # files. Idempotent: skips re-download when the stamp fetch-node writes
        # beside the blobs (node-blobs.stamp) matches and every blob is present.
        run: go run ./tools/fetch-node

      - name: Generate Windows resources
        # go-winres works on any host OS — it produces a Windows .syso
        # blob from declarative JSON. The .syso file uses filename build
        # constraints (rsrc_windows_amd64.syso) so go build picks it up
        # under GOOS=windows but ignores it on other platforms.
        #
        # winres.json is patched in-place with the version metadata via
        # jq (always available on ubuntu runners). Pre-release suffixes
        # like "-test.1" are stripped from the numeric version because
        # Windows resource metadata only accepts major.minor.patch.build.
        # VERSION and COMMIT come from the step above.
        run: |
          set -euo pipefail
          VERSION_STRING="${VERSION} (${COMMIT})"
          NUMERIC_BASE="${VERSION%%-*}"
          NUMERIC_VERSION="${NUMERIC_BASE}.0"

          # Pinned to a released tag, like staticcheck in ci.yml: this runs
          # inside the job that produces the .syso linked into the Windows
          # binary the same job then signs, so an unpinned third-party
          # `go install` here is a supply-chain hole in a signed artifact.
          go install github.com/tc-hib/go-winres@v0.3.3

          jq --arg ver "$NUMERIC_VERSION" --arg vs "$VERSION_STRING" '
            .RT_MANIFEST."#1"."0409".identity.version = $ver
            | .RT_VERSION."#1"."0000".fixed.file_version = $ver
            | .RT_VERSION."#1"."0000".fixed.product_version = $ver
            | .RT_VERSION."#1"."0000".info."0409".FileVersion = $vs
            | .RT_VERSION."#1"."0000".info."0409".ProductVersion = $vs
          ' cmd/moombox/winres/winres.json > cmd/moombox/winres/winres.json.tmp
          mv cmd/moombox/winres/winres.json.tmp cmd/moombox/winres/winres.json

          cd cmd/moombox
          go-winres make --arch amd64
          cd ../..

      # Sequential cross-compiles, each in its own step. Tried 3-way
      # parallel earlier — on ubuntu-latest (4 vCPUs) each go build was
      # already CPU-saturating alone, so concurrent builds just contended
      # for cores (~8s saved, not worth the complexity / latent
      # footguns). Sequential gives clean per-binary logs and the first
      # build naturally warms the module cache for the next two.
      - name: Build Moombox.exe (windows/amd64)
        env:
          CGO_ENABLED: 0
          GOOS: windows
          GOARCH: amd64
        run: go build -ldflags "$LDFLAGS" -o Moombox.exe ./cmd/moombox

      - name: Build moombox-linux-amd64
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: go build -ldflags "$LDFLAGS" -o moombox-linux-amd64 ./cmd/moombox

      - name: Smoke-test moombox-linux-amd64
        # The one binary of the three this runner can execute. --version
        # answers before the launcher and before any config is read, so this
        # proves the binary starts at all and that the ldflags carried the
        # version and commit into it.
        run: |
          set -euo pipefail
          got=$(./moombox-linux-amd64 --version)
          want="moombox ${VERSION} (${COMMIT})"
          if [ "$got" != "$want" ]; then
            echo "moombox-linux-amd64 --version printed: $got"
            echo "expected:                              $want"
            exit 1
          fi
          echo "$got"

      - name: Build moombox-linux-arm64
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: arm64
        run: go build -ldflags "$LDFLAGS" -o moombox-linux-arm64 ./cmd/moombox

      # Sequential sign, each in its own step. Each go run ./cmd/sign
      # invocation is sub-second; the overhead of three steps is small
      # and per-binary failure attribution is easier to read in the
      # Actions UI.
      - name: Sign Moombox.exe
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: go run ./cmd/sign Moombox.exe

      - name: Sign moombox-linux-amd64
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: go run ./cmd/sign moombox-linux-amd64

      - name: Sign moombox-linux-arm64
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: go run ./cmd/sign moombox-linux-arm64

      - name: Build release body
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          WIN_LINK="[**\`Download Moombox.exe for Windows (x64)\`**](https://github.com/${REPO}/releases/download/${TAG_NAME}/Moombox.exe)"
          LIN_AMD_LINK="[**\`Download moombox-linux-amd64 for Linux (x64)\`**](https://github.com/${REPO}/releases/download/${TAG_NAME}/moombox-linux-amd64)"
          LIN_ARM_LINK="[**\`Download moombox-linux-arm64 for Linux (arm64)\`**](https://github.com/${REPO}/releases/download/${TAG_NAME}/moombox-linux-arm64)"

          if [ -f RELEASE_NOTES.md ] && [ -s RELEASE_NOTES.md ]; then
            {
              echo "$WIN_LINK"
              echo "$LIN_AMD_LINK"
              echo "$LIN_ARM_LINK"
              echo ""
              echo "---"
              echo ""
              cat RELEASE_NOTES.md
            } > release_body.md
            echo "use_github_notes=false" >> "$GITHUB_ENV"
          else
            {
              echo "$WIN_LINK"
              echo "$LIN_AMD_LINK"
              echo "$LIN_ARM_LINK"
            } > release_body.md
            echo "use_github_notes=true" >> "$GITHUB_ENV"
          fi

      - name: Dry run — show what a tag would have published
        if: github.event_name != 'push'
        run: |
          echo "Dry run of $VERSION ($COMMIT): built and signed; the upload below goes to a draft that is then deleted."
          ls -l Moombox.exe Moombox.exe.sig moombox-linux-amd64 moombox-linux-amd64.sig moombox-linux-arm64 moombox-linux-arm64.sig
          echo "--- release body ---"
          cat release_body.md

      - name: Create GitHub Release with all 6 assets
        # ONE step for both modes, so a dry run executes the same action, the
        # same token and the same file list a tag does. What differs comes
        # from the version step: a tag push publishes under its own tag; a
        # dry run uploads to a DRAFT named dryrun-<run>-<attempt> — never
        # public, creates no git tag — which the next step checks and deletes.
        id: publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: ${{ env.RELEASE_DRAFT }}
          body_path: release_body.md
          generate_release_notes: ${{ env.use_github_notes == 'true' }}
          # Tags containing '-' (e.g. v2.6.0-test.1, v2.6.0-beta.2, v2.6.0-rc.1)
          # are treated as pre-releases: GitHub won't mark them "Latest" and the
          # /releases/latest endpoint continues to point at the last stable tag.
          # A dry run's draft is never "Latest" either.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ (github.event_name != 'push' || contains(github.ref_name, '-')) && 'false' || 'true' }}
          # Off by default: a path below that matched no file would be a
          # warning, and the release would publish without that asset.
          fail_on_unmatched_files: true
          files: |
            Moombox.exe
            Moombox.exe.sig
            moombox-linux-amd64
            moombox-linux-amd64.sig
            moombox-linux-arm64
            moombox-linux-arm64.sig

      - name: Dry run — check the draft release, then delete it
        # always(): a draft the upload step created and then failed on must
        # still be removed. Deleted before it is judged, for the same reason.
        if: always() && github.event_name != 'push' && steps.publish.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.publish.outputs.id }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_ID" ]; then
            # The upload step died before reporting an id. gh finds a draft by
            # the name it was given, if one was created at all.
            gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes || true
            echo "the upload step reported no release id"
            exit 1
          fi
          found=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '"draft=\(.draft) assets=\(.assets | length)"')
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
          echo "draft release $RELEASE_TAG: $found — deleted"
          if [ "$found" != "draft=true assets=6" ]; then
            echo "expected draft=true assets=6"
            exit 1
          fi
