name: Build and Publish Docker Image

# Publishes ghcr.io/vampiricwulf/moombox. Multi-arch: linux/amd64 +
# linux/arm64. The Dockerfile compiles both on the native runner
# (CGO_ENABLED=0 cross-compile); QEMU is only used for the small Debian
# runtime stage of the arm64 image.
#
# Two ways in, and no tag trigger of its own:
#
#   workflow_call      release.yml runs this as a job after its release
#                      job, so a release tag publishes the image only once
#                      the binaries are built, signed and published. The
#                      test suite runs beside both and gates neither. A
#                      release dry run calls it with push: false.
#   workflow_dispatch  builds and pushes an `edge` tag from main — useful
#                      for testing image changes without cutting a release.
#                      Untick "push" to only build both architectures. On
#                      any other ref it only builds, whatever "push" says.
#
# What may push (owner ruling R2-O2). The `push` input asks; the job's PUBLISH
# value decides, and it is true only for
#
#   - a tag PUSH, which reaches this file through release.yml (under
#     workflow_call github.event_name is the caller's event), or
#   - a run on refs/heads/main, which the tag rules below give `edge` alone.
#
# So `latest` and the version tags move only on a real tag push. A manual run
# with a tag selected builds both architectures and stops: before this gate
# it rebuilt that tag and pushed it as X.Y.Z, X.Y and `latest`, which moved
# `latest` back to an old version for everyone who pulls it. To publish the
# image for an existing tag again, use "Re-run failed jobs" on that tag's
# release run, which is still a push.
#
# The gate covers only tags created from the commit that added it on. A manual
# run on a tag executes THAT TAG'S copy of this file, so for v2.9.9 and older
# the copy has no gate and still pushes: never "Run workflow" on one of those.

on:
  workflow_call:
    inputs:
      push:
        description: Push the built image to ghcr.io
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      push:
        description: Push the built image to ghcr.io (untick to only build)
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    # Without a limit a stalled Debian mirror or registry upload holds the
    # run for GitHub's six hours, with the release already published and no
    # image. The job took 4 to 8.5 minutes in the releases since September
    # 2026, before the start check added its load and one short run.
    timeout-minutes: 45
    env:
      # The one place that decides whether this run pushes; see the header.
      PUBLISH: ${{ inputs.push && (github.event_name == 'push' || github.ref == 'refs/heads/main') }}
    steps:
      - name: Say whether this run publishes
        env:
          ASKED: ${{ inputs.push }}
        run: |
          if [ "$PUBLISH" = "true" ]; then
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              echo "Tag push of $GITHUB_REF_NAME: the image is built and pushed under the release's tags."
            else
              echo "Run on main: the image is built and pushed as edge."
            fi
          elif [ "$ASKED" = "true" ]; then
            echo "::notice::Build only. A $GITHUB_EVENT_NAME run on $GITHUB_REF does not push: only a tag push or a run on main does."
          else
            echo "Build only: push was not asked for."
          fi

      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/vampiricwulf/moombox
          # Release tag vX.Y.Z → X.Y.Z, X.Y, and latest (latest=auto skips
          # pre-release tags like v2.9.0-test.1, matching release.yml's
          # prerelease handling). A run on main → edge. The semver rules
          # also match a manual run on a tag, which is why PUBLISH, not
          # these rules, is what keeps such a run from pushing.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=main

      - name: Compute version build args
        # Mirrors release.yml: main.version gets the tag without the v
        # prefix; main.commit gets the short SHA. On non-tag builds the
        # version arg is left empty so the binary keeps the version
        # hardcoded in cmd/moombox/main.go.
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "MOOMBOX_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "MOOMBOX_VERSION=" >> "$GITHUB_ENV"
          fi
          echo "MOOMBOX_COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      # Build-and-start check (owner ruling R2-O3). Until this step nothing
      # ever ran the image: the multi-arch build below only proves it
      # builds, and a break in docker/entrypoint.sh or in the binary's start
      # inside the image was left for a user to find. The amd64 image is
      # built into the runner's own Docker (load), with the same build args,
      # and started once. The multi-arch build then reuses these layers from
      # the same builder, so the cost is the load and one short run. It runs
      # in every use of this workflow, so in a release, a release dry run
      # and a manual run, and in no pull request.
      - name: Build the amd64 image for the start check
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          # Never pushed, so it needs no attestation, and an image with one
          # cannot be loaded into the runner's Docker.
          provenance: false
          tags: moombox:start-check
          build-args: |
            VERSION=${{ env.MOOMBOX_VERSION }}
            COMMIT=${{ env.MOOMBOX_COMMIT }}

      - name: Start the image once
        # `--version` through the entrypoint on an empty /data: the
        # entrypoint seeds config.toml and README-docker.txt, then the
        # binary answers before it reads the config or opens a database.
        timeout-minutes: 5
        run: bash .github/scripts/image-smoke.sh moombox:start-check "$MOOMBOX_COMMIT" "$MOOMBOX_VERSION"

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.MOOMBOX_VERSION }}
            COMMIT=${{ env.MOOMBOX_COMMIT }}
          # No cache-from/cache-to. The type=gha layer cache this carried was
          # saved under each tag's own ref, which no later tag can read: the
          # v2.8.10 build reused zero layers and exported ~1.1 GB that then
          # sat in the repo's cache quota beside the caches CI does use. A
          # release image is also better built cold — a cached apt layer
          # would keep shipping the Debian packages of the day it was saved.
