services:
  moombox:
    image: ghcr.io/vampiricwulf/moombox:latest
    # To build from source instead of pulling the published image,
    # comment out `image:` above and uncomment:
    # build: .
    container_name: moombox
    restart: unless-stopped
    # tini as PID 1: reaps any orphaned ffmpeg/sidecar processes.
    init: true
    # Give in-flight muxing/finalization time to complete on shutdown.
    stop_grace_period: 1m
    ports:
      # In the container, network_access defaults to "lan", so anything
      # that can reach this published port can use the dashboard.
      # Use "127.0.0.1:774:774" to restrict it to the Docker host only.
      #
      # Moombox listens dual-stack inside the container, and judges an
      # IPv6 client by the "lan" filter on its real address: a ULA or
      # link-local one is admitted, a global IPv6 one gets 403 Forbidden
      # (see the networks: block at the bottom of this file). Reach the
      # dashboard over the host's IPv4 address — a hostname whose AAAA
      # record the browser picks gets the 403, and browsers do not retry
      # over IPv4 after a 403.
      # Publishing as "0.0.0.0:774:774" instead stops this port
      # from accepting IPv6 at all; the network below keeps its IPv6
      # address and outbound IPv6 either way.
      #
      # Docker Desktop (Windows/macOS) NOTE: all inbound connections are
      # proxied through the Desktop VM, so Moombox sees every client as the
      # private gateway IP and the "lan" filter cannot tell clients apart.
      # There, the port publish is the ONLY exposure control — keep it
      # host-only or LAN-firewalled.
      - "774:774"
    volumes:
      # Everything lives under /data: config.toml, database, logs,
      # staging, finished downloads, sidecar cache.
      - ./data:/data
      # Optional: put finished downloads on a separate (bigger) disk:
      # - /mnt/media/vods:/data/output
      #
      # Netscape cookie file for members-only content: put it at
      # ./data/cookies.txt on the host. The ./data mount above already
      # exposes it, and the seeded config points at /data/cookies.txt — so
      # there is NO extra volume line to add.
      #
      # Do not bind-mount the file on its own (e.g.
      # "- ./cookies.txt:/data/cookies.txt"). Moombox keeps the YouTube
      # session alive by rewriting cookies.txt roughly every 30 minutes with
      # the values YouTube rotates back, and it writes a temp file and
      # renames it over the original. A rename cannot replace a single-file
      # bind mount, so the write-back fails, only a warning is logged, and
      # the session quietly ages out until downloads start failing for a
      # reason that looks nothing like a mount problem. Adding ":ro" breaks
      # it the same way.
    # environment:
    #   # Time zone for ${start_date}/${start_time} in new filenames and for
    #   # log timestamps (the image ships tzdata; unset means UTC). Archives
    #   # already written keep their names; nothing renames them:
    #   - TZ=America/Los_Angeles
    # Run as a specific user instead of root (make sure ./data is
    # writable by that uid first):
    # user: "1000:1000"
    healthcheck:
      # TCP connect to the dashboard port. If you change network.port in
      # config.toml, update (or remove) this too.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/774"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  # Why this block exists: without it, Docker's userland proxy accepts
  # IPv6 connections to the published port and re-originates them from the
  # bridge gateway's PRIVATE IPv4 address — so an internet IPv6 client is
  # misclassified as private and passes Moombox's "lan" network_access
  # filter. That is the hole this closes.
  #
  # What actually happens with this block on Docker Engine 27+ (where
  # ip6tables is on by default for IPv6-enabled networks): inbound IPv6 is
  # DNATed to the container, keeping the client's own address, instead of
  # being re-originated by the userland proxy. Moombox listens dual-stack,
  # so it accepts those connections and the "lan" filter judges the REAL
  # client address: a ULA (fc00::/7) or link-local (fe80::/10) client is
  # admitted, and a global IPv6 one — any internet client — gets 403
  # Forbidden. The hole is closed by the filter seeing the real address.
  #
  # So: reach the dashboard over the host's IPv4 address. A LAN client
  # whose own IPv6 address is a global one (what most home networks hand
  # out) gets the 403 too, and browsers do not retry over IPv4 after a
  # 403 — so a hostname with an AAAA record fails for it whether or not
  # it also has an A record. Use the IPv4 address or an IPv4-only name, or
  # publish as "0.0.0.0:774:774" (see the ports: comment above) so the
  # port stops accepting IPv6 in the first place.
  #
  # On Docker Engine < 27, ip6tables is off, the userland proxy still
  # handles IPv6, and the misclassification above — the hole — persists.
  # Upgrade the engine, or publish as "0.0.0.0:774:774".
  #
  # The subnet is an arbitrary ULA — change it if it collides with yours.
  default:
    # If "docker compose up" fails to CREATE this network, the host cannot
    # do IPv6 (e.g. booted with ipv6.disable=1) and an IPv6-enabled
    # network cannot exist there. Recovery: delete this whole networks:
    # block, or set enable_ipv6 to false and drop the ipam: subnet with
    # it — accepting that the misclassification hole reopens on that host.
    enable_ipv6: true
    ipam:
      config:
        - subnet: "fd77:4d42::/64"
