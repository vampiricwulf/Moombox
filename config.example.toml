# Moombox Configuration
# Copy this file to config.toml and edit to your needs.
# All settings shown here are the defaults — uncomment and change as needed.
#
# Moombox also includes a first-time setup wizard (TUI and web dashboard)
# that generates this file for you.

# ─── Network ─────────────────────────────────────────────────────────────────
[network]

# Web dashboard and API port
# port = 774

# Network access level: who can reach the dashboard and API
#   "localhost" — only this machine (default, most secure)
#   "lan"      — any device on your local network
#   "external" — any device (use with caution)
#   "public"   — a config-file-only synonym for "external" (rejected as an API
#                input, absent from both UIs); identical runtime behavior,
#                including that authentication is still enforced once a
#                password is set
# Before exposing the dashboard beyond this machine, read the "Remote Access"
# section of the README. Who is admitted follows a saved change at once;
# moving off "localhost" also needs a restart, because the server starts
# listening on the network only at startup.
# network_access = "localhost"

# Enable built-in HTTPS with a self-signed certificate.
# A certificate is auto-generated on first start and reused on restarts.
# https_enabled = false

# Custom paths for TLS certificate and key (defaults shown).
# Provide your own files to use a CA-signed certificate instead.
# tls_cert_path = "./moombox.crt"
# tls_key_path = "./moombox.key"

# Lifetime of the "remember me" client token, in days — enforced by the
# server as well as set as the cookie's lifetime.
# Defaults to 365 (1 year). Range: 1 to 3650 (~10 years). Shorter values
# reduce blast radius of a leaked cookie; longer values reduce re-login
# friction for personal-use setups.
# client_token_ttl_days = 365

# Reverse-proxy addresses (bare IPs or CIDRs) whose X-Forwarded-For header
# is trusted when working out the real client IP for access control
# (network_access gate, auth, rate limiting). Leave EMPTY unless Moombox
# sits behind a reverse proxy you control: without it a proxy makes every
# request — including internet traffic — look like it comes from the
# proxy's private address, which passes the "lan" filter and skips auth.
# With it, the proxy must be the only route to Moombox's port (bind the
# port to localhost / keep it unpublished in Docker).
# Applies immediately — no restart needed. Example:
# trusted_proxies = ["172.18.0.0/16"]

# Set the session cookie's Secure flag from the X-Forwarded-Proto header.
# Enable ONLY when Moombox sits behind a TLS-terminating reverse proxy
# (nginx, Caddy, Traefik) that strips any client-supplied X-Forwarded-Proto
# before adding its own; otherwise a client can forge it. Without it, a
# reverse-proxy deployment gets non-Secure session cookies, because Moombox
# itself only ever sees plaintext HTTP from the proxy.
# trust_forwarded_proto = false

# Externally reachable base URL of this dashboard, e.g. "https://moombox.example.com"
# or "http://192.168.1.10:774" on a LAN. Used only to link back to the dashboard
# from notification embeds (a job's title links to "{public_url}/#job=<id>").
# Moombox never binds to it or validates that it reaches this process — it's a
# reverse proxy, tunnel, or port forward the operator has separately set up.
# Must be an absolute http(s) URL with a host and no query, fragment, or
# credentials. Leave unset (default) to omit the dashboard link from embeds.
# Applies immediately — no restart needed.
# public_url = "https://moombox.example.com"

# ─── Paths ────────────────────────────────────────────────────────────────────
[paths]

# Path to the SQLite database file
# database_path = "./moombox.db"

# Text log file path (rotated automatically)
# log_file_path = "./moombox.log"

# Output directory for finished downloads
# output_directory = "./output"

# Temporary directory for in-progress downloads (segments, chat, resume state)
# staging_directory = "./staging"

# Path to FFmpeg binary (auto-detected from PATH if not set)
# ffmpeg_path = "/usr/bin/ffmpeg"

# ─── Logs ─────────────────────────────────────────────────────────────────────
[logs]

# Log level: "DEBUG", "INFO" (default), "WARN", "ERROR"
# log_level = "INFO"

# Max size per log file before rotation (bytes). Default: 10 MB.
# log_max_file_size = 10485760

# Number of rotated log files to keep
# log_max_files = 5

# ─── Monitors ─────────────────────────────────────────────────────────────────
[monitors]

# How many days back to archive. Upcoming/live streams are always covered
# regardless of this window.
# archive_window_days = 3

# How many backlog (non-live) downloads a channel can have running at once,
# so new live/upcoming content never waits behind a backlog sweep.
# archive_slots = 3

# How often to check RSS feeds (in minutes, or duration string like "10m")
# feed_check_interval = 10

# DECAPI check interval in seconds, 15 to 3600. Leave unset (default) for
# dynamic timing based on DECAPI's rate limit.
# decapi_check_interval = 60

# Twitch check interval in seconds, 5 to 3600 (default: 15). A ±10% jitter
# is always applied.
# twitch_check_interval = 15

# Finished jobs older than this are moved to the Archived section in the
# TUI and web dashboard. Accepts a number (days) or duration string like "30d".
# Set to 0 to instantly archive all finished jobs.
# hide_finished_age_days = 30

# Minimum time between re-probing the SAME video's metadata through the YouTube
# player API. Each feed/DECAPI cycle re-lists the same upcoming/unfinished
# videos, so this caps how often each is re-checked. Accepts a number (seconds)
# or a duration string like "30s"/"2m". 0 disables it — every cycle re-probes
# every listed video, and your check intervals become the only throttle. There
# is no maximum. Default: 0.
# probe_cooldown = 0

# Scan each YouTube channel's members-only tab every cycle. RSS and DECAPI
# never list members-only videos, so this is the only way Moombox finds
# members-only streams (and their VODs/premieres, for channels with
# include_non_live_content). Needs YouTube cookies to find anything.
# membership_discovery = true

# ─── Downloader ───────────────────────────────────────────────────────────────
[downloader]

# Filename template. Variables: ${title}, ${id}, ${channel}, ${start_date}, ${start_time}
# output_template = "${channel}/${start_date} ${title} [${id}]"

# Maximum video resolution, compared against the SHORTER frame dimension — so
# 2160 recognises 4K both ways round (3840x2160 and 2160x3840) and a 720x1280
# portrait stream counts as 720. Moombox takes the largest rendition at or below
# this; when a stream offers nothing that small it takes the closest one above,
# so the cap never leaves a recording empty. 0 = unbounded (always the largest).
# max_video_resolution = 2160

# Peak concurrent VOD downloads across all channels. Live streams always
# download immediately and never wait on this pool, so total concurrent
# downloads can reach (live streams) + num_parallel_downloads. Per-channel
# backlog pacing is governed by archive_slots; this is the global ceiling.
# num_parallel_downloads = 10

# Segments fetched at once WITHIN one download (not the number of concurrent
# downloads). Higher values catch up faster on an in-progress stream, at the
# cost of a wider fan-out to YouTube. Minimum 1, no maximum; values above 16
# are logged as a bot-detection risk.
# segment_workers = 12

# Out-of-order segment bytes ONE download may hold in RAM while its
# head-of-order segment works through its retry ladder. 0 = unbounded.
# Default 1024; 256 on arm64, where the cap was originally chosen.
# reorder_buffer_mb = 1024

# The same bytes, summed across EVERY download running at once. Without it,
# reorder_buffer_mb multiplies by the number of concurrent downloads. 0 =
# unbounded. Default 4096; 1024 on arm64. A reorder_buffer_mb above this
# budget is clamped to it (with a warning at startup).
# reorder_budget_mb = 4096

# Download live chat alongside streams
# download_chat = true

# Prefer 60fps streams when available at the same resolution
# prefer_60fps = true

# YouTube livestreams: how long (seconds) to keep retrying — re-checking stream
# status every 30s — before assuming the stream has finished even if YouTube
# still reports it live. The clock resets whenever a segment arrives. Minimum 30;
# there is no maximum, but very large values keep polling YouTube for a long
# time, which can risk negative consequences on your account.
# maximum_timeout = 600

# How long (minutes, or a duration string like "2h") finalize may stall
# waiting for an interrupted broadcast to resume before finalizing with what
# was captured so far. 0 disables the stall — finalize never waits. No
# maximum.
# interruption_timeout = 120

# How long (days, or a duration string like "7d") a finished recording
# flagged with an incomplete tail keeps its staging files preserved for
# Resume. After that the staging becomes eligible for orphan cleanup; the
# incomplete badge itself never expires. 0 = preserve forever. No maximum.
# incomplete_staging_expiry_days = 7

# Advanced: minimum gap (milliseconds) between one job's progress reports.
# This is what caps the per-job update rate everywhere downstream — the
# progress bar, the WebSocket frames and the TUI's rows all move at most this
# often. 16 ms is about 60 reports a second; 8 ms is about 120, matching the
# TUI's 120 fps renderer; 100 ms is ten. Each report costs one database write
# and one fan-out to every connected client, so lower values buy smoothness
# with CPU and disk. Minimum 1; there is no maximum. Read when a job STARTS,
# so a change applies to the next download rather than one already running.
# Default: 16.
# progress_interval_ms = 16

# ─── Cookies ──────────────────────────────────────────────────────────────────
[cookies]

# Netscape-format cookie file for member-only content
# cookie_file = "./cookies.txt"

# Automatic cookie acquisition via browser. When enabled, Moombox can
# launch a browser for you to log into YouTube, then extract and refresh
# cookies automatically.
#
# Firefox is recommended (reads cookies directly from SQLite).
# Edge and Chrome are supported as fallback (uses Chrome DevTools Protocol).
#
# Setup: use the web dashboard Settings page or TUI setup wizard to
# launch the browser and complete login. That works whatever auto_enabled
# says — it is how you SUPPLY cookies, not something this flag switches
# on.
#
# auto_enabled itself governs exactly two things: a slow second refresh
# that re-opens the profile below in a headless browser on a timer, and
# one automatic browser attempt when authentication fails (with it off,
# Moombox notifies you instead). The in-process refresh that keeps the
# YouTube session alive runs either way — it is gated on cookie_file
# alone — and so does the manual import below. The timer starts or stops
# on restart; the automatic attempt on an authentication failure follows
# this setting as soon as it is saved.
#
# HEADLESS HOSTS AND DOCKER: when no supported browser is installed,
# Moombox imports cookies straight out of the profile directory below —
# no browser launch, and nothing is written into the profile. Point
# browser_profile_dir at a SINGLE Firefox profile (the directory holding
# prefs.js and cookies.sqlite), not its parent. In the Docker image the
# default resolves to /data/browser-profile, so a bind mount there needs
# no config change at all — leave auto_enabled off, since there is no
# browser in the image for it to start.
#
# On such a host, a start with no cookies.txt yet imports the profile
# once on its own — there is nothing on disk to lose. (On a desktop with
# a browser installed this does not happen: the browser drives the normal
# refresh path instead.) After that YOU trigger the import:
# press "Refresh cookies from browser profile" on the Settings page
# (shift+clicking the header's "Refresh cookies" does the same, and R F
# does it in the TUI; the Settings button is the one that works on a
# phone). Moombox does not re-read the profile on a timer once you have
# cookies, deliberately — nothing on such a host changes the profile, so
# a timer would re-read identical bytes over credentials that may still
# be working.
#
# Copy the profile with Firefox closed, and keep cookies.sqlite-wal
# alongside cookies.sqlite — recent cookies live in that sidecar and a
# copy without it reads as empty (cookies.sqlite-shm is rebuilt and does
# not need copying). Importing refreshes what the profile holds; it
# cannot renew SAPISID/LOGIN_INFO, so an exported profile still ages out
# eventually.
# auto_enabled = false
# browser_profile_dir = "./browser-profile"

# How often the auto_enabled refresh timer above runs, in minutes (or a
# duration string like "6h"). Range: 10 to 10080 (7 days). Takes effect on
# restart.
# refresh_interval = 360

# Override the auto-detected browser with an exact executable. browser_type
# is required when browser_path is set, and names the browser: one of
# "firefox", "waterfox", "librewolf", "zen", "chrome", "brave", "edge",
# "vivaldi", "thorium", "opera". Leave both unset to auto-detect.
# browser_path = ""
# browser_type = ""

# Which platforms' cookie status the status bar shows. Unset (default) uses
# the platforms whose cookies Moombox has verified, then the platforms of
# your enabled channels. An empty list (active_platforms = []) shows neither.
# active_platforms = ["youtube", "twitch"]

# acquisition selects HOW a cookie REFRESH acquires credentials:
#   "auto"    — a resolvable browser takes the headless launch path above; a
#               host with none imports browser_profile_dir read-only.
#   "profile" — never launches a browser for a refresh; always imports
#               browser_profile_dir read-only, even on a desktop that has a
#               browser installed.
# Default: "auto". Read live through the running service — no restart
# needed, unlike auto_enabled above.
# acquisition = "auto"

# dpapi_fallback turns on the Windows-only DPAPI read: when the CDP refresh
# launch fails (Chrome already open, a resource the managed-profile launch
# cannot acquire), Moombox reads the cookies out of a real Chromium-family
# profile through CryptUnprotectData. Those are the user's actual signed-in
# cookies, so it is an opt-in privacy surface and it is OFF by default. It
# must be true for dpapi_profile_dir below to be read at all.
# dpapi_fallback = false

# dpapi_profile_dir names a Chromium-family PROFILE directory for the
# Windows DPAPI fallback to read, taking precedence over the automatic
# discovery walk. Set it when your profile is somewhere the walk cannot
# see: a portable Chromium, a --user-data-dir install, or Opera.
#
# Name the PROFILE directory, not the User Data root. Moombox checks for a
# "Local State" beside it (Chromium's User Data root) or inside it (Opera,
# which has no root above the profile), and for "Cookies" or
# "Network/Cookies" inside, and refuses with a message naming what was
# missing. A relative path is resolved against Moombox's working
# directory, the same as the paths.* settings.
#
# It needs dpapi_fallback = true above: that flag is what turns the DPAPI
# read on at all, and it is off by default. With the flag off, this
# directory is never read and Moombox says so once at startup.
#
# Windows-only in effect, like dpapi_fallback. The DPAPI pass re-reads this
# value every time it runs, so it needs no restart once something can
# change it — but today it is config.toml-only (no UI control, no API
# setter), so edit it and restart, and make the edit while Moombox is
# stopped: a settings save from either UI writes the in-memory config back
# and would put the old value there.
# dpapi_profile_dir = 'C:\PortableChrome\User Data\Default'

# ─── BotGuard PO Token Sidecar ─────────────────────────────────────────────
# Moombox bundles a Node.js + JSDOM + bgutils-js subprocess that produces
# real PO tokens for YouTube. The sidecar binds locally only and runs
# automatically when needed; first launch extracts ~36 MB of embedded
# blobs to the user cache directory (one-time, ~3-5s):
# %LOCALAPPDATA%\Moombox\sidecar on Windows, ~/.cache/Moombox/sidecar on
# Linux.
#
# Disable to run the in-process goja path only. It cannot pass BotGuard's
# timing check, so it mints no PO tokens, and it cannot solve signature
# ciphers for current players: PO-token-gated and signature-ciphered
# formats become unavailable.
# [bgutils]
# use_sidecar = true                         # Default: true. Set to false to disable.

# ─── Memory Limits ──────────────────────────────────────────────────────────
# Soft caps on steady-state memory for the Go process and the BotGuard
# sidecar. See docs/spec/operations.md "Memory Limits" for the design.
#
# Defaults are tuned to sit ABOVE normal operating ranges so GC fires only
# on real growth, not routine streaming work. Lower these to trade CPU for
# memory; raise them when GC pressure becomes visible. Set any field to 0
# to disable that specific cap (Go uses unbounded behaviour; sidecar uses
# V8's ~512-1500 MB default ceiling).
# [memory]
# go_soft_limit_mb = 256                     # debug.SetMemoryLimit; soft, no OOM.
# sidecar_soft_limit_mb = 200                # RSS threshold to fire sidecar GC.
# sidecar_hard_limit_mb = 512                # V8 --max-old-space-size; OOMs on hit.

# ─── Disk Space ─────────────────────────────────────────────────────────────
# [disk]
# disk_warn_percent = 90                     # Warning alert when the output disk is this full (1-99).
# disk_critical_percent = 95                 # Critical alert at this usage; must be above the warning.

# ─── Updates ────────────────────────────────────────────────────────────────
# [updates]
# auto_check_updates = true                  # Check GitHub for a new version on startup and every 24 hours.

# ─── Connectivity ───────────────────────────────────────────────────────────
# [connectivity]
# probe_targets = ["1.1.1.1:443", "8.8.8.8:443", "9.9.9.9:443"]  # host:port TCP targets raced to detect internet reachability (requires restart)

# ─── Webhook Notifications ──────────────────────────────────────────────────
# Send Discord webhook notifications for stream events. Discord only —
# parseTarget accepts a full Discord webhook URL or a "discord://ID/TOKEN"
# shorthand, nothing else.
# You can add multiple [[notifications]] blocks for different endpoints.
#
# The full event vocabulary is documented in docs/spec/operations.md under
# "Event Types". A target with no "events" filter receives all of them.
#
# [[notifications]]
# url = "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
# enabled = true                           # Optional: false mutes this target without deleting it (default: true)
# events = ["found", "finished", "error"]  # Optional: only send these events (default: all)
# mention = "<@&123456789012345678>"       # Optional: content line to ping a role (<@&ID>), a user (<@ID>), @everyone, or @here
# mention_events = ["error", "auth"]       # Optional: which events the mention rides along with.
#                                             Omit entirely to use the default six (error, auth, disk_critical,
#                                             update_failed, crash_recovered, sidecar_down); set to [] to never mention.
# mode = "separate"                        # Optional: "separate" (default: one message per event) or
#                                             "edit" (one message per job, rewritten in place as it
#                                             progresses; alerts stay separate)

# ─── Channels ─────────────────────────────────────────────────────────────────
# Add channels to monitor. Each [[channels]] block defines one channel.
# Channels can also be managed from the web dashboard Settings page.
#
# The "terms" field is a regex pattern matched against the video title (on
# Twitch, the title or the game category). Matching is always
# case-insensitive. Patterns are RE2: no lookahead, so a pattern cannot
# exclude a word.
#
# YouTube channel:
# [[channels]]
# id = "UCxxxxxxxxxx"                        # YouTube channel ID (required)
# name = "Channel Name"                      # Display name (optional)
# terms = "(?i)karaoke|singing"              # Regex filter on the title (optional)
# include_non_live_content = false            # Also download regular uploads (default: false)
# archive_window_days = 3                    # Override global archive_window_days (optional)
# archive_slots = 3                          # Override global archive_slots (optional)
# output_directory = "./output/special"      # Override output directory (optional)
# quality_preference = "1080p60"             # Quality cap for this channel (optional, see below)

# Twitch channel:
# [[channels]]
# id = "channelname"                         # Twitch login name (required)
# name = "Channel Name"                      # Display name (optional)
# platform = "twitch"                        # Required for Twitch channels
# quality_preference = "best"                # Quality cap for this channel (optional, see below)
#
# quality_preference works on YouTube and Twitch channels alike. Accepted
# values: "best", "2160p60", "2160p", "1440p60", "1440p", "1080p60", "1080p",
# "900p60", "900p", "720p60", "720p", "480p", "360p", "160p", "audio_only".
