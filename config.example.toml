# Moombox Configuration
# Copy this file to config.toml and edit to your needs.
# All settings shown here are the defaults — uncomment and change as needed.
#
# Moombox also includes a first-time setup wizard (TUI and web dashboard)
# that generates this file for you.

# ─── Network ─────────────────────────────────────────────────────────────────
[network]

# Web dashboard and API port
# port = 774

# Network access level: who can reach the dashboard and API
#   "localhost" — only this machine (default, most secure)
#   "lan"      — any device on your local network
#   "external" — any device (use with caution)
#   "public"   — a config-file-only synonym for "external" (rejected as an API
#                input, absent from both UIs); identical runtime behavior,
#                including that authentication is still enforced once a
#                password is set
# Before exposing the dashboard beyond this machine, read the "Remote Access"
# section of the README.
# network_access = "localhost"

# Enable built-in HTTPS with a self-signed certificate.
# A certificate is auto-generated on first start and reused on restarts.
# https_enabled = false

# Custom paths for TLS certificate and key (defaults shown).
# Provide your own files to use a CA-signed certificate instead.
# tls_cert_path = "./moombox.crt"
# tls_key_path = "./moombox.key"

# Lifetime of the "remember me" client token cookie, in days.
# Defaults to 365 (1 year). Range: 1 to 3650 (~10 years). Shorter values
# reduce blast radius of a leaked cookie; longer values reduce re-login
# friction for personal-use setups.
# client_token_ttl_days = 365

# Reverse-proxy addresses (bare IPs or CIDRs) whose X-Forwarded-For header
# is trusted when working out the real client IP for access control
# (network_access gate, auth, rate limiting). Leave EMPTY unless Moombox
# sits behind a reverse proxy you control: without it a proxy makes every
# request — including internet traffic — look like it comes from the
# proxy's private address, which passes the "lan" filter and skips auth.
# With it, the proxy must be the only route to Moombox's port (bind the
# port to localhost / keep it unpublished in Docker).
# Applies immediately — no restart needed. Example:
# trusted_proxies = ["172.18.0.0/16"]

# ─── Paths ────────────────────────────────────────────────────────────────────
[paths]

# Path to the SQLite database file
# database_path = "./moombox.db"

# Text log file path (rotated automatically)
# log_file_path = "./moombox.log"

# Output directory for finished downloads
# output_directory = "./output"

# Temporary directory for in-progress downloads (segments, chat, resume state)
# staging_directory = "./staging"

# Path to FFmpeg binary (auto-detected from PATH if not set)
# ffmpeg_path = "/usr/bin/ffmpeg"

# ─── Logs ─────────────────────────────────────────────────────────────────────
[logs]

# Log level: "DEBUG", "INFO" (default), "WARN", "ERROR"
# log_level = "INFO"

# Max size per log file before rotation (bytes). Default: 10 MB.
# log_max_file_size = 10485760

# Number of rotated log files to keep
# log_max_files = 5

# ─── Monitors ─────────────────────────────────────────────────────────────────
[monitors]

# How many days back to archive. Upcoming/live streams are always covered
# regardless of this window.
# archive_window_days = 3

# How many backlog (non-live) downloads a channel can have running at once,
# so new live/upcoming content never waits behind a backlog sweep.
# archive_slots = 3

# How often to check RSS feeds (in minutes, or duration string like "10m")
# feed_check_interval = 10

# DECAPI check interval in seconds (0 = dynamic rate-limit based). Optional.
# decapi_check_interval = 0

# Twitch check interval in seconds (default: 15). Optional.
# twitch_check_interval = 15

# Finished jobs older than this are moved to the Archived section in the
# TUI and web dashboard. Accepts a number (days) or duration string like "30d".
# Set to 0 to instantly archive all finished jobs.
# hide_finished_age_days = 30

# Minimum time between re-probing the SAME video's metadata through the YouTube
# player API. Each feed/DECAPI cycle re-lists the same upcoming/unfinished
# videos, so this caps how often each is re-checked. Accepts a number (seconds)
# or a duration string like "30s"/"2m". 0 disables it — every cycle re-probes
# every listed video, and your check intervals become the only throttle. There
# is no maximum. Default: 0.
# probe_cooldown = 0

# ─── Downloader ───────────────────────────────────────────────────────────────
[downloader]

# Filename template. Variables: ${title}, ${id}, ${channel}, ${start_date}, ${start_time}
# output_template = "${channel}/${start_date} ${title} [${id}]"

# Maximum video resolution. Based on max(width, height), so portrait videos
# are handled correctly (e.g., 2160 allows both 3840x2160 and 2160x3840).
# max_video_resolution = 2160

# Peak concurrent VOD downloads across all channels. Live streams always
# download immediately and never wait on this pool, so total concurrent
# downloads can reach (live streams) + num_parallel_downloads. Per-channel
# backlog pacing is governed by archive_slots; this is the global ceiling.
# num_parallel_downloads = 10

# Download live chat alongside streams
# download_chat = true

# Prefer 60fps streams when available at the same resolution
# prefer_60fps = true

# YouTube livestreams: how long (seconds) to keep retrying — re-checking stream
# status every 30s — before assuming the stream has finished even if YouTube
# still reports it live. The clock resets whenever a segment arrives. Minimum 30;
# there is no maximum, but very large values keep polling YouTube for a long
# time, which can risk negative consequences on your account.
# maximum_timeout = 600

# Advanced: manual PO token override (bypasses built-in BotGuard generation)
# po_token = ""

# Advanced: manual visitor data override
# visitor_data = ""

# Advanced: external POT provider URL (instead of built-in BotGuard)
# pot_provider_url = ""

# ─── Cookies ──────────────────────────────────────────────────────────────────
[cookies]

# Netscape-format cookie file for member-only content
# cookie_file = "./cookies.txt"

# Automatic cookie acquisition via browser. When enabled, Moombox can
# launch a browser for you to log into YouTube, then extract and refresh
# cookies automatically.
#
# Firefox is recommended (reads cookies directly from SQLite).
# Edge and Chrome are supported as fallback (uses Chrome DevTools Protocol).
#
# Setup: use the web dashboard Settings page or TUI setup wizard to
# launch the browser and complete login. That works whatever auto_enabled
# says — it is how you SUPPLY cookies, not something this flag switches
# on.
#
# auto_enabled itself governs exactly two things: a slow second refresh
# that re-opens the profile below in a headless browser on a timer, and
# one automatic browser attempt when authentication fails (with it off,
# Moombox notifies you instead). The in-process refresh that keeps the
# YouTube session alive runs either way — it is gated on cookie_file
# alone — and so does the manual import below. Takes effect on restart.
#
# HEADLESS HOSTS AND DOCKER: when no supported browser is installed,
# Moombox imports cookies straight out of the profile directory below —
# no browser launch, and nothing is written into the profile. Point
# browser_profile_dir at a SINGLE Firefox profile (the directory holding
# prefs.js and cookies.sqlite), not its parent. In the Docker image the
# default resolves to /data/browser-profile, so a bind mount there needs
# no config change at all — leave auto_enabled off, since there is no
# browser in the image for it to start.
#
# On such a host, a start with no cookies.txt yet imports the profile
# once on its own — there is nothing on disk to lose. (On a desktop with
# a browser installed this does not happen: the browser drives the normal
# refresh path instead.) After that YOU trigger the import:
# press "Refresh cookies from browser profile" on the Settings page
# (shift+clicking the header's "Refresh cookies" does the same, and R F
# does it in the TUI; the Settings button is the one that works on a
# phone). Moombox does not re-read the profile on a timer once you have
# cookies, deliberately — nothing on such a host changes the profile, so
# a timer would re-read identical bytes over credentials that may still
# be working.
#
# Copy the profile with Firefox closed, and keep cookies.sqlite-wal
# alongside cookies.sqlite — recent cookies live in that sidecar and a
# copy without it reads as empty (cookies.sqlite-shm is rebuilt and does
# not need copying). Importing refreshes what the profile holds; it
# cannot renew SAPISID/LOGIN_INFO, so an exported profile still ages out
# eventually.
# auto_enabled = false
# browser_profile_dir = "./browser-profile"

# ─── BotGuard PO Token Sidecar ─────────────────────────────────────────────
# Moombox bundles a Node.js + JSDOM + bgutils-js subprocess that produces
# real PO tokens for YouTube. The sidecar binds locally only and runs
# automatically when needed; first launch extracts ~36 MB of embedded
# blobs to %LOCALAPPDATA%/Moombox/sidecar (one-time, ~3-5s).
#
# Disable to fall back to the in-process goja-only path. The fallback
# still works for most YouTube content but cannot pass BotGuard's timing
# fingerprint check, so PO-token-gated formats become unavailable.
# [bgutils]
# use_sidecar = true                         # Default: true. Set to false to disable.

# ─── Memory Limits ──────────────────────────────────────────────────────────
# Soft caps on steady-state memory for the Go process and the BotGuard
# sidecar. See docs/spec/operations.md "Memory Limits" for the design.
#
# Defaults are tuned to sit ABOVE normal operating ranges so GC fires only
# on real growth, not routine streaming work. Lower these to trade CPU for
# memory; raise them when GC pressure becomes visible. Set any field to 0
# to disable that specific cap (Go uses unbounded behaviour; sidecar uses
# V8's ~512-1500 MB default ceiling).
# [memory]
# go_soft_limit_mb = 256                     # debug.SetMemoryLimit; soft, no OOM.
# sidecar_soft_limit_mb = 200                # RSS threshold to fire sidecar GC.
# sidecar_hard_limit_mb = 512                # V8 --max-old-space-size; OOMs on hit.

# ─── Webhook Notifications ──────────────────────────────────────────────────
# Send webhook notifications for stream events.
# Works with Discord, Slack, ntfy, or any service that accepts POST webhooks.
# You can add multiple [[notifications]] blocks for different endpoints.
#
# Available events for filtering:
#   found       — New video detected in RSS feed
#   added       — Video manually added by user
#   scheduled   — Upcoming stream scheduled
#   live        — Stream went live
#   downloading — Download started
#   muxing      — FFmpeg muxing started
#   finished    — Download completed successfully
#   error       — Download failed
#   auth        — Authentication issue (COOKIES? status)
#   cancelled   — Job cancelled by user
#
# [[notifications]]
# url = "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
# events = ["live", "finished", "error"]   # Optional: only send these events (default: all)
# tags = ["important"]                     # Optional: tags for routing/filtering

# ─── Channels ─────────────────────────────────────────────────────────────────
# Add channels to monitor. Each [[channels]] block defines one channel.
# Channels can also be managed from the web dashboard Settings page.
#
# The "terms" field is a regex pattern matched against both the video title
# and description. Use (?i) for case-insensitive matching.
#
# YouTube channel:
# [[channels]]
# id = "UCxxxxxxxxxx"                        # YouTube channel ID (required)
# name = "Channel Name"                      # Display name (optional)
# terms = "(?i)karaoke|singing"              # Regex filter for title + description (optional)
# include_non_live_content = false            # Also download regular uploads (default: false)
# num_desc_lookbehind = 3                    # Compare descriptions with N older items (optional)
# archive_window_days = 3                    # Override global archive_window_days (optional)
# archive_slots = 3                          # Override global archive_slots (optional)
# output_directory = "./output/special"      # Override output directory (optional)

# Twitch channel:
# [[channels]]
# id = "channelname"                         # Twitch login name (required)
# name = "Channel Name"                      # Display name (optional)
# platform = "twitch"                        # Required for Twitch channels
# quality_preference = "best"                # "best", "720p", "480p", or "audio_only"
